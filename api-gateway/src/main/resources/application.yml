server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # /api/pedidos/** -> pedido-service /pedidos/**
        - id: pedido-service
          uri: http://${PEDIDO_HOST:localhost}:8081
          predicates:
            - Path=/api/pedidos/**
          filters:
            - StripPrefix=1
        # /api/notificacoes/** -> notificacao-service /notificacoes/**
        - id: notificacao-service
          uri: http://${NOTIFICACAO_HOST:localhost}:8082
          predicates:
            - Path=/api/notificacoes/**
          filters:
            - StripPrefix=1
      default-filters:
        # Identifica cada requisição que passou pelo gateway
        - AddResponseHeader=X-Gateway, ecommerce-api-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
